# Alembic configuration for Shree Shyam Home Stay backend.
# The database URL is supplied at runtime from environment variables
# (see alembic/env.py) — the placeholder below is never used directly.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/shree_shyam

[post_write_hooks]
# Uncomment to auto-format migrations with ruff after generation:
# post_write_hooks = ruff
# hooks.ruff.executable = ruff
# hooks.ruff.type = console_scripts
# hooks.ruff.options = format

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
