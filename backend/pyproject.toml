[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shree-shyam-backend"
version = "0.1.0"
description = "Shree Shyam Home Stay Management System - backend (Phase 1.1 foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: run against a real PostgreSQL database (skipped when unreachable locally; enforced in CI)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (Depends() in default args) is the idiomatic FastAPI pattern.
ignore = ["B008"]
