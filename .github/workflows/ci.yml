name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: Lint, typecheck, SQLite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Reject tracked database artifacts
        run: |
          found="$(git ls-files '*.db' '*.sqlite' '*.sqlite3' '*-journal' '*-wal' '*-shm')"
          if [ -n "$found" ]; then echo "Tracked database artifacts forbidden: $found"; exit 1; fi
      - name: Install backend (dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy app
      - name: Tests (SQLite)
        working-directory: backend
        run: pytest -q

  desktop-tests:
    name: Desktop unit tests (Electron shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run desktop unit tests (preinstalled Node.js)
        working-directory: desktop
        run: node --test test/

  postgres-integration:
    name: Alembic migrations + PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel_app
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: shree_shyam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_app -d shree_shyam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hotel_app:ci-only-test-password@localhost:5432/shree_shyam
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend (dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Alembic upgrade head (clean PostgreSQL)
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migrated schema
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import inspect, text
          from app.core.db import get_engine

          inspector = inspect(get_engine())
          tables = set(inspector.get_table_names())
          missing = {"users", "sessions", "audit_log", "guests", "bookings", "folio_entries", "payments", "receipts", "guest_portal_tokens", "tour_packages", "local_info", "alembic_version"} - tables
          assert not missing, f"missing tables: {missing}"
          cols = {c["name"] for c in inspector.get_columns("users")}
          needed = {"id", "username", "password_hash", "role", "is_active", "created_at", "updated_at"}
          assert needed <= cols, f"users table incomplete: {needed - cols}"
          gcols = {c["name"] for c in inspector.get_columns("guests")}
          gneeded = {"id", "full_name", "phone", "is_active", "created_at", "updated_at"}
          assert gneeded <= gcols, f"guests table incomplete: {gneeded - gcols}"
          assert "ix_guests_phone_name_active" in {i["name"] for i in inspector.get_indexes("guests")}
          bcols = {c["name"] for c in inspector.get_columns("bookings")}
          bneeded = {"id", "booking_ref", "guest_id", "room_id", "status", "check_in_date", "check_out_date", "nights", "night_rate_snapshot", "room_subtotal", "total_amount", "checked_in_at", "checked_in_by", "checked_out_at", "checked_out_by"}
          assert bneeded <= bcols, f"bookings table incomplete: {bneeded - bcols}"
          fcols = {c["name"] for c in inspector.get_columns("folio_entries")}
          fneeded = {"id", "booking_id", "entry_type", "description", "quantity", "amount", "is_initial", "created_by", "created_at"}
          assert fneeded <= fcols, f"folio_entries table incomplete: {fneeded - fcols}"
          pcols = {c["name"] for c in inspector.get_columns("payments")}
          pneeded = {"id", "booking_id", "amount", "mode", "payment_stage", "received_by", "received_at", "is_reversal", "reverses_payment_id"}
          assert pneeded <= pcols, f"payments table incomplete: {pneeded - pcols}"
          rcols = {c["name"] for c in inspector.get_columns("receipts")}
          rneeded = {"id", "booking_id", "receipt_ref", "kind", "content_hash", "pdf_content", "generated_by", "created_at"}
          assert rneeded <= rcols, f"receipts table incomplete: {rneeded - rcols}"
          tpcols = {c["name"] for c in inspector.get_columns("tour_packages")}
          tpneeded = {"id", "name", "description", "duration", "price", "image_url", "contact_number", "is_active", "display_order", "created_at", "updated_at"}
          assert tpneeded <= tpcols, f"tour_packages table incomplete: {tpneeded - tpcols}"
          lpcols = {c["name"] for c in inspector.get_columns("local_info")}
          lpneeded = {"id", "title", "description", "location", "contact_number", "image_url", "is_active", "display_order", "created_at", "updated_at"}
          assert lpneeded <= lpcols, f"local_info table incomplete: {lpneeded - lpcols}"
          tcols = {c["name"] for c in inspector.get_columns("guest_portal_tokens")}
          tneeded = {"id", "booking_id", "token_hash", "created_at", "revoked_at", "last_accessed_at"}
          assert tneeded <= tcols, f"guest_portal_tokens table incomplete: {tneeded - tcols}"
          with get_engine().connect() as conn:
              assert conn.execute(text("SELECT 1")).scalar() == 1
              crows = conn.execute(text("SELECT conname FROM pg_constraint WHERE conrelid = 'bookings'::regclass"))
              cnames = {r[0] for r in crows}
              assert "excl_bookings_room_daterange" in cnames, f"missing exclusion constraint: {cnames}"
              trows = conn.execute(text("SELECT tgname FROM pg_trigger WHERE tgrelid IN ('folio_entries'::regclass, 'payments'::regclass, 'receipts'::regclass) AND NOT tgisinternal"))
              tnames = {r[0] for r in trows}
              assert {"trg_folio_entries_immutable", "trg_payments_immutable", "trg_receipts_immutable"} <= tnames, f"missing immutability triggers: {tnames}"
          print("schema OK:", sorted(tables))
          PY
      - name: PostgreSQL integration tests (must run — skips fail the build)
        working-directory: backend
        run: pytest -q -m postgres --run-postgres-check
